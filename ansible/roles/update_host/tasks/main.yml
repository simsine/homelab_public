---
- name: Update cache & upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
  become: true

- name: Check if system reboot is needed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: update_host_reboot_required

- name: Reboot system if needed
  ansible.builtin.reboot:
  become: true
  when: update_host_reboot_required.stat.exists
