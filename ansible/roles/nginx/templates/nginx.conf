load_module modules/ngx_http_acme_module.so;

user nginx nginx;
worker_processes auto;
worker_rlimit_nofile 2048;

error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    # tcp_nopush on;
    gzip  on;
    keepalive_timeout 10;
    server_tokens off;

    resolver 1.1.1.1;

    ### For ssl cert
    acme_issuer letsencrypt {
        uri        https://acme-v02.api.letsencrypt.org/directory;
        # contact    admin@example.test;
        state_path /var/cache/nginx/acme-letsencrypt;

        accept_terms_of_service;
    }

    ### For WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default     keep-alive;
        'websocket' upgrade;
        ''          close;
    }

    # include /etc/nginx/conf.d/*.conf;

    ### General listener on port 80 is required to process ACME HTTP-01 challenges
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        ### Redirect to https
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name bupie.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        root /var/www/html/bupie;

        index index.html;

        open_file_cache          max=10000 inactive=30s;
        open_file_cache_valid    60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors   on;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name aperture.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        default_type text/plain;
        return 200 "Welcome to Aperture Science Home Laboratories!";
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name glados.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        default_type text/plain;
        return 200 "Oh... It's you.";
    }

    upstream headscale {
        zone upstreams 64K;
        server 127.0.0.1:8080 max_fails=1 fail_timeout=5s;
        keepalive 2;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name headscale.simsine.no;

        # Tailscale captive portal detection
        location = /generate_204 {
            return 204;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name headscale.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header True-Client_IP $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_pass http://headscale;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        client_max_body_size 10M;

        server_name beszel.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_pass http://localhost:8090;
            proxy_set_header Host $server_name;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            ### websockets
            proxy_read_timeout 360s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        http2 on;

        server_name uptime.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_pass http://localhost:3001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name yatzy.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_pass http://localhost:8008;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    upstream copyparty_uds {
        server unix:/run/copyparty/copyparty.sock fail_timeout=1s;
        keepalive 1;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name files.simsine.no;

        client_max_body_size 1024M;
        client_header_timeout 610m;
        client_body_timeout 610m;
        send_timeout 610m;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_pass http://copyparty_uds;
            proxy_redirect off;
            # disable buffering (next 4 lines)
            proxy_http_version 1.1;
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;
            # improve download speed from 600 to 1500 MiB/s
            proxy_buffers 32 8k;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 24k;

            proxy_set_header   Connection        "Keep-Alive";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}

stream {
    # Minecraft server tcp proxy
    server {
        listen 25565 reuseport;
        proxy_pass minecraft_backend;

        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
    }
    
    upstream minecraft_backend {
        server 100.64.0.8:25565;
    }

    # Simple voicechat server udp proxy 
    server {
        listen 24454 udp reuseport;
        proxy_pass svc_minecraft_backend;
        
        proxy_connect_timeout 1s;
        proxy_timeout 60s;
    }

    upstream svc_minecraft_backend {
        server 100.64.0.8:24454;
    }
}
